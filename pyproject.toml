[project]
name = "odoo-mcp-server"
version = "0.1.0"
description = "Servidor MCP que conecta Claude (Cowork, Desktop, Code) con Odoo ERP vía XML-RPC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emat" }]
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
odoo-mcp-server = "odoo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_mcp"]
